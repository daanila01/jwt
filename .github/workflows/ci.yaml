name: CI

on:
    pull_request:
        branches: [main, dev]
    push:
        branches: [main]

permissions:
    contents: read

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-go@v5
              with:
                  go-version: stable
            - name: Check formatting
              run: |
                  unformatted=$(gofmt -l .)
                  if [ -n "$unformatted" ]; then
                      echo "Not gofmt-ed:"
                      echo "$unformatted"
                      exit 1
                  fi
            - run: go vet ./...

    test:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                go-version: ["1.22", "1.25", "stable"]
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-go@v5
              with:
                  go-version: ${{ matrix.go-version }}
            - run: go build ./...
            - run: go test -race -timeout 5m -cover -coverprofile=coverage.out ./...

            # Only the stable job publishes coverage; the others would overwrite it.
            - name: Render coverage
              if: matrix.go-version == 'stable'
              run: go tool cover -html=coverage.out -o coverage.html
            - uses: actions/upload-artifact@v4
              if: matrix.go-version == 'stable'
              with:
                  name: coverage-report
                  path: coverage.html

    # A short fuzz run on every change. Thirty seconds finds nothing most days,
    # which is the point: it is a tripwire, not a campaign. A serious hunt is
    # `make fuzz FUZZTIME=10m` on a machine nobody is waiting on.
    fuzz:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-go@v5
              with:
                  go-version: stable
            - run: go test -run '^$' -fuzz '^FuzzParse$' -fuzztime 30s .
            - run: go test -run '^$' -fuzz '^FuzzParseHeaderOnly$' -fuzztime 30s .

    # Benchmarks are compiled and run once each, only to prove they still work.
    # Numbers from a shared runner vary too much between runs to be worth publishing.
    bench:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-go@v5
              with:
                  go-version: stable
            - run: go test -run '^$' -bench . -benchtime 1x ./...
